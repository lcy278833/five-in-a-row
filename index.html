<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五子棋</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* ===== 游戏容器 ===== */
        .container {
            background: #16213e;
            border-radius: 20px;
            padding: 25px 30px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            max-width: 640px;
            width: 100%;
            margin: 15px;
        }

        /* ===== 顶部栏 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #fff;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header .title {
            font-size: 20px;
            font-weight: bold;
            color: #f0c27f;
            letter-spacing: 2px;
        }
        .header .status {
            font-size: 15px;
            padding: 5px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            white-space: nowrap;
        }
        .header .status .highlight {
            color: #f0c27f;
            font-weight: bold;
        }
        .header .status .your-turn {
            color: #2ecc71;
            font-weight: bold;
        }
        .header .status .waiting {
            color: #f39c12;
            font-weight: bold;
        }

        /* ===== 棋盘 ===== */
        .canvas-wrapper {
            background: #deb887;
            border-radius: 12px;
            padding: 8px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
            border-radius: 8px;
            cursor: pointer;
            touch-action: none;
            background: #deb887;
        }

        /* ===== 控制栏 ===== */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .controls .left {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .controls .right {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 7px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            white-space: nowrap;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-pass {
            background: #27ae60;
        }
        .btn-pass:hover:not(:disabled) {
            background: #2ecc71;
        }

        .btn-reset {
            background: #e67e22;
        }
        .btn-reset:hover {
            background: #f39c12;
        }

        .btn-mode {
            background: #3498db;
        }
        .btn-mode:hover {
            background: #5dade2;
        }
        .btn-mode.active {
            background: #2ecc71;
        }

        .btn-online {
            background: #9b59b6;
        }
        .btn-online:hover:not(:disabled) {
            background: #af7ac5;
        }
        .btn-online.connected {
            background: #e74c3c;
        }
        .btn-online.connected:hover {
            background: #c0392b;
        }

        /* ===== 网络状态文字 ===== */
        .online-status {
            font-size: 13px;
            color: #aaa;
            margin-top: 6px;
            text-align: center;
        }
        .online-status .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .online-status .dot.green {
            background: #2ecc71;
        }
        .online-status .dot.red {
            background: #e74c3c;
        }
        .online-status .dot.yellow {
            background: #f1c40f;
        }

        /* ===== 让棋信息 ===== */
        .pass-info {
            font-size: 12px;
            color: #aaa;
            margin-left: 4px;
        }
        .pass-info .count {
            color: #f0c27f;
            font-weight: bold;
        }

        /* ===== 胜利弹窗 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 24px;
            padding: 40px 50px 35px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            animation: popIn 0.3s ease;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
        }
        @keyframes popIn {
            from {
                transform: scale(0.7) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal-box .winner {
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .modal-box .winner.black {
            color: #1a1a1a;
        }
        .modal-box .winner.white {
            color: #666;
        }
        .modal-box .winner.draw {
            color: #f39c12;
        }
        .modal-box .winner-emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 4px;
        }
        .modal-box .sub {
            font-size: 15px;
            color: #888;
            margin-bottom: 20px;
        }
        .modal-box .btn-restart {
            padding: 10px 40px;
            background: #2ecc71;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-box .btn-restart:hover {
            background: #27ae60;
            transform: scale(1.03);
        }

        /* ===== 菜单遮罩 ===== */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(6px);
        }
        .menu-overlay.hidden {
            display: none;
        }
        .menu-box {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 30px;
            padding: 45px 50px 40px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            max-width: 400px;
            width: 92%;
        }
        .menu-box h1 {
            color: #f0c27f;
            font-size: 40px;
            margin-bottom: 4px;
            letter-spacing: 6px;
        }
        .menu-box .subtitle {
            color: #888;
            font-size: 15px;
            margin-bottom: 28px;
        }
        .menu-box .menu-btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin-bottom: 12px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
            color: #fff;
        }
        .menu-box .menu-btn:hover:not(:disabled) {
            transform: scale(1.03);
        }
        .menu-box .menu-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .menu-box .menu-btn.local {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
        .menu-box .menu-btn.local:hover:not(:disabled) {
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.3);
        }
        .menu-box .menu-btn.online {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
        }
        .menu-box .menu-btn.online:hover:not(:disabled) {
            box-shadow: 0 0 30px rgba(155, 89, 182, 0.3);
        }
        .menu-box .menu-btn.exit {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        .menu-box .menu-btn.exit:hover:not(:disabled) {
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.3);
        }
        .menu-box .hint {
            color: #666;
            font-size: 13px;
            margin-top: 16px;
            line-height: 1.8;
        }
        .menu-box .hint kbd {
            background: #333;
            color: #fff;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #555;
        }

        .menu-box .ws-config {
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .menu-box .ws-config label {
            color: #888;
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }
        .menu-box .ws-config input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #0d0d1a;
            color: #fff;
            font-size: 14px;
            font-family: monospace;
            outline: none;
            transition: border-color 0.3s;
        }
        .menu-box .ws-config input:focus {
            border-color: #9b59b6;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 550px) {
            .container {
                padding: 15px 16px 20px;
                margin: 10px;
                border-radius: 14px;
            }
            .header .title {
                font-size: 16px;
            }
            .header .status {
                font-size: 13px;
                padding: 4px 12px;
            }
            .btn {
                font-size: 12px;
                padding: 5px 12px;
            }
            .controls {
                gap: 6px;
            }
            .controls .left,
            .controls .right {
                gap: 5px;
            }
            .menu-box {
                padding: 30px 25px 28px;
            }
            .menu-box h1 {
                font-size: 30px;
            }
            .menu-box .menu-btn {
                font-size: 15px;
                padding: 12px 0;
            }
            .modal-box {
                padding: 30px 25px 28px;
            }
            .modal-box .winner {
                font-size: 26px;
            }
            .modal-box .winner-emoji {
                font-size: 38px;
            }
            .online-status {
                font-size: 12px;
            }
            .pass-info {
                font-size: 11px;
            }
            .menu-box .ws-config input {
                font-size: 12px;
                padding: 6px 10px;
            }
        }
        @media (max-width: 400px) {
            .container {
                padding: 10px 10px 14px;
                margin: 6px;
                border-radius: 10px;
            }
            .header .title {
                font-size: 14px;
            }
            .header .status {
                font-size: 11px;
                padding: 3px 10px;
            }
            .btn {
                font-size: 11px;
                padding: 4px 10px;
            }
            .menu-box h1 {
                font-size: 26px;
            }
            .menu-box .menu-btn {
                font-size: 14px;
                padding: 10px 0;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 菜单 ===== -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-box">
            <h1>♟ 五子棋</h1>
            <div class="subtitle">选择游戏模式</div>
            <button class="menu-btn local" id="menuLocalBtn" onclick="startLocalGame()">👥 双人对战</button>
            <button class="menu-btn online" id="menuOnlineBtn" onclick="startOnlineGame()">🌐 网络对战</button>
            <button class="menu-btn exit" onclick="exitGame()">✕ 退出</button>
            <div class="hint">
                <kbd>ESC</kbd> 返回菜单 &nbsp;·&nbsp; <kbd>P</kbd> 让棋
            </div>
            <div class="ws-config">
                <label>WebSocket 服务器地址</label>
                <input type="text" id="wsUrlInput" value="ws://localhost:8765">
            </div>
        </div>
    </div>

    <!-- ===== 游戏主界面 ===== -->
    <div class="container" id="gameContainer" style="display:none;">
        <div class="header">
            <span class="title">♟ 五子棋</span>
            <span class="status" id="statusMsg">⚫ 黑棋走</span>
        </div>
        <div class="canvas-wrapper">
            <canvas id="boardCanvas" width="560" height="560"></canvas>
        </div>
        <div class="controls">
            <div class="left">
                <button class="btn btn-pass" id="passBtn" onclick="doPass()">
                    让棋 (<span id="passCount">0</span>/3)
                </button>
                <button class="btn btn-reset" onclick="resetGame()">🔄 重开</button>
            </div>
            <div class="right">
                <button class="btn btn-mode" id="modeBtn" onclick="toggleMode()">👥 双人</button>
                <button class="btn btn-online" id="onlineStatusBtn" onclick="toggleOnline()">🌐 离线</button>
            </div>
        </div>
        <div class="online-status" id="onlineStatusText">
            <span class="dot red"></span> 未连接服务器
        </div>
    </div>

    <!-- ===== 胜利弹窗 ===== -->
    <div class="modal-overlay" id="winModal">
        <div class="modal-box">
            <span class="winner-emoji" id="winnerEmoji">🏆</span>
            <div class="winner" id="winnerText">黑棋 获胜！</div>
            <div class="sub" id="winnerSub">点击下方按钮重新开始</div>
            <button class="btn-restart" onclick="closeWinModal()">🔄 重新开始</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  常量
        // ============================================================
        const BOARD_SIZE = 15;
        const MAX_PASS = 3;

        // ============================================================
        //  DOM 引用
        // ============================================================
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const statusMsg = document.getElementById('statusMsg');
        const passBtn = document.getElementById('passBtn');
        const passCountSpan = document.getElementById('passCount');
        const winModal = document.getElementById('winModal');
        const winnerText = document.getElementById('winnerText');
        const winnerEmoji = document.getElementById('winnerEmoji');
        const winnerSub = document.getElementById('winnerSub');
        const modeBtn = document.getElementById('modeBtn');
        const onlineStatusBtn = document.getElementById('onlineStatusBtn');
        const onlineStatusText = document.getElementById('onlineStatusText');
        const menuOverlay = document.getElementById('menuOverlay');
        const gameContainer = document.getElementById('gameContainer');
        const wsUrlInput = document.getElementById('wsUrlInput');

        // ============================================================
        //  游戏状态
        // ============================================================
        let board = [];
        let currentPlayer = 'black';
        let gameOver = false;
        let passCount = 0;
        let lastWasPass = false;
        let mode = 'local';
        let isOnline = false;
        let ws = null;
        let playerColor = null;
        let isMyTurn = false;
        let winner = null;
        let isMenuOpen = true;
        let moveHistory = [];
        let isProcessingMove = false;

        // ============================================================
        //  棋盘初始化
        // ============================================================
        function initBoard() {
            board = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                board.push(new Array(BOARD_SIZE).fill(null));
            }
            currentPlayer = 'black';
            gameOver = false;
            passCount = 0;
            lastWasPass = false;
            winner = null;
            moveHistory = [];
            isMyTurn = (mode === 'local' || playerColor === 'black');
            updateUI();
        }

        // ============================================================
        //  绘制
        // ============================================================
        function drawBoard() {
            const w = canvas.width;
            const h = canvas.height;
            const margin = w / (BOARD_SIZE + 1);
            const cellSize = w / (BOARD_SIZE + 1);

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#deb887';
            ctx.fillRect(0, 0, w, h);

            // 网格
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            for (let i = 0; i < BOARD_SIZE; i++) {
                const pos = margin + i * cellSize;
                ctx.beginPath();
                ctx.moveTo(margin, pos);
                ctx.lineTo(w - margin, pos);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(pos, margin);
                ctx.lineTo(pos, h - margin);
                ctx.stroke();
            }

            // 天元/星位
            const starPoints = [
                [3, 3],
                [3, 11],
                [11, 3],
                [11, 11],
                [7, 7]
            ];
            ctx.fillStyle = '#000';
            for (let [r, c] of starPoints) {
                const x = margin + c * cellSize;
                const y = margin + r * cellSize;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // 棋子
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const val = board[r][c];
                    if (val) {
                        const x = margin + c * cellSize;
                        const y = margin + r * cellSize;
                        const radius = cellSize / 2 - 3;
                        // 阴影
                        ctx.shadowColor = 'rgba(0,0,0,0.3)';
                        ctx.shadowBlur = 6;
                        ctx.shadowOffsetX = 2;
                        ctx.shadowOffsetY = 2;
                        ctx.beginPath();
                        ctx.arc(x, y, radius, 0, Math.PI * 2);
                        const gradient = ctx.createRadialGradient(
                            x - radius * 0.3, y - radius * 0.3, radius * 0.1,
                            x, y, radius
                        );
                        if (val === 'black') {
                            gradient.addColorStop(0, '#666');
                            gradient.addColorStop(1, '#000');
                        } else {
                            gradient.addColorStop(0, '#fff');
                            gradient.addColorStop(1, '#ddd');
                        }
                        ctx.fillStyle = gradient;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.shadowOffsetX = 0;
                        ctx.shadowOffsetY = 0;
                        ctx.strokeStyle = val === 'black' ? '#000' : '#bbb';
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        // ============================================================
        //  UI 更新
        // ============================================================
        function updateUI() {
            let status = '';
            if (gameOver) {
                if (winner === 'draw') {
                    status = '🤝 平局！';
                } else if (winner) {
                    const cn = winner === 'black' ? '⚫ 黑棋' : '⚪ 白棋';
                    status = `🏆 ${cn} 获胜！`;
                } else {
                    status = '⏸ 游戏结束';
                }
            } else {
                const cn = currentPlayer === 'black' ? '⚫ 黑棋' : '⚪ 白棋';
                if (mode === 'local') {
                    status = cn + '走';
                } else {
                    if (currentPlayer === playerColor) {
                        status = cn + '走 ← <span class="your-turn">你的回合</span>';
                    } else {
                        status = cn + '走 ← <span class="waiting">等待对手...</span>';
                    }
                }
            }
            statusMsg.innerHTML = status;

            const canPass = !gameOver && passCount < MAX_PASS && (mode === 'local' || (isMyTurn && !gameOver));
            passBtn.disabled = !canPass;
            passCountSpan.textContent = passCount;

            modeBtn.textContent = mode === 'local' ? '👥 双人' : '🌐 网络';
            modeBtn.className = 'btn btn-mode' + (mode === 'online' ? ' active' : '');

            if (isOnline && ws && ws.readyState === WebSocket.OPEN) {
                onlineStatusBtn.textContent = '🌐 已连接';
                onlineStatusBtn.className = 'btn btn-online connected';
                const colorName = playerColor === 'black' ? '⚫ 黑棋' : '⚪ 白棋';
                onlineStatusText.innerHTML = '<span class="dot green"></span> 已连接服务器 - 你执 ' + colorName;
            } else if (isOnline) {
                onlineStatusBtn.textContent = '🌐 连接中...';
                onlineStatusBtn.className = 'btn btn-online';
                onlineStatusText.innerHTML = '<span class="dot yellow"></span> 正在连接...';
            } else {
                onlineStatusBtn.textContent = '🌐 离线';
                onlineStatusBtn.className = 'btn btn-online';
                onlineStatusText.innerHTML = '<span class="dot red"></span> 未连接服务器';
            }

            drawBoard();
        }

        // ============================================================
        //  游戏逻辑
        // ============================================================
        function getChinese(player) {
            return player === 'black' ? '黑棋' : '白棋';
        }

        function checkWin(row, col, player) {
            const directions = [
                [0, 1],
                [1, 0],
                [1, 1],
                [1, -1]
            ];
            for (let [dr, dc] of directions) {
                let count = 1;
                for (let dir of [1, -1]) {
                    for (let step = 1; step < 5; step++) {
                        const r = row + dr * step * dir;
                        const c = col + dc * step * dir;
                        if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE || board[r][c] !== player) break;
                        count++;
                    }
                }
                if (count >= 5) return true;
            }
            return false;
        }

        function isBoardFull() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === null) return false;
                }
            }
            return true;
        }

        function canPass() {
            return !gameOver && passCount < MAX_PASS && (mode === 'local' || isMyTurn);
        }

        function doPass() {
            if (!canPass()) return;
            if (mode === 'online') {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'pass',
                        player: playerColor
                    }));
                }
                return;
            }
            executePass();
        }

        function executePass() {
            passCount++;
            lastWasPass = true;
            currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
            if (mode === 'online') {
                isMyTurn = (currentPlayer === playerColor);
            }
            updateUI();
        }

        function placePiece(row, col) {
            if (gameOver) return false;
            if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return false;
            if (board[row][col] !== null) return false;
            if (mode === 'online' && !isMyTurn) return false;

            board[row][col] = currentPlayer;
            lastWasPass = false;
            moveHistory.push({ row, col, player: currentPlayer });

            if (checkWin(row, col, currentPlayer)) {
                gameOver = true;
                winner = currentPlayer;
                updateUI();
                showWinModal(getChinese(currentPlayer) + ' 获胜！');
                return true;
            } else if (isBoardFull()) {
                gameOver = true;
                winner = 'draw';
                updateUI();
                showWinModal('平局！');
                return true;
            }

            currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
            if (mode === 'online') {
                isMyTurn = (currentPlayer === playerColor);
            }
            updateUI();
            return true;
        }

        // ============================================================
        //  点击/触摸事件
        // ============================================================
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            return { x, y };
        }

        function handleCanvasClick(e) {
            if (gameOver) return;
            if (mode === 'online' && !isMyTurn) return;

            const { x, y } = getCanvasCoords(e);
            const margin = canvas.width / (BOARD_SIZE + 1);
            const cellSize = canvas.width / (BOARD_SIZE + 1);

            const col = Math.round((x - margin) / cellSize);
            const row = Math.round((y - margin) / cellSize);
            if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return;
            if (board[row][col] !== null) return;

            if (mode === 'online') {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'move',
                        row: row,
                        col: col,
                        player: playerColor
                    }));
                }
            } else {
                placePiece(row, col);
            }
        }

        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchstart', handleCanvasClick, { passive: false });

        // ============================================================
        //  键盘事件
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'p' || e.key === 'P') {
                e.preventDefault();
                doPass();
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                if (!isMenuOpen) {
                    showMenu();
                }
            }
        });

        // ============================================================
        //  胜利弹窗
        // ============================================================
        function showWinModal(text) {
            winnerText.textContent = text;
            winnerText.className = 'winner';
            if (text.includes('黑棋')) {
                winnerText.className += ' black';
                winnerEmoji.textContent = '⚫';
            } else if (text.includes('白棋')) {
                winnerText.className += ' white';
                winnerEmoji.textContent = '⚪';
            } else if (text.includes('平局')) {
                winnerText.className += ' draw';
                winnerEmoji.textContent = '🤝';
            }
            winnerSub.textContent = '点击下方按钮重新开始';
            winModal.classList.add('show');
        }

        function closeWinModal() {
            winModal.classList.remove('show');
            resetGame();
        }

        // ============================================================
        //  重置
        // ============================================================
        function resetGame() {
            initBoard();
            if (mode === 'online' && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'reset' }));
            }
            winModal.classList.remove('show');
            updateUI();
        }

        // ============================================================
        //  菜单
        // ============================================================
        function showMenu() {
            isMenuOpen = true;
            menuOverlay.classList.remove('hidden');
            gameContainer.style.display = 'none';
            if (mode === 'online' && ws) {
                ws.close();
                ws = null;
                isOnline = false;
            }
        }

        function hideMenu() {
            isMenuOpen = false;
            menuOverlay.classList.add('hidden');
            gameContainer.style.display = 'block';
            if (mode === 'online') {
                updateUI();
            }
        }

        function startLocalGame() {
            mode = 'local';
            isOnline = false;
            if (ws) { ws.close();
                ws = null; }
            playerColor = null;
            isMyTurn = true;
            initBoard();
            hideMenu();
            updateUI();
        }

        // ============================================================
        //  模式切换
        // ============================================================
        function toggleMode() {
            if (mode === 'local') {
                if (isOnline && ws) { ws.close(); }
                mode = 'online';
                isOnline = false;
                ws = null;
                playerColor = null;
                isMyTurn = false;
                showMenu();
            } else {
                mode = 'local';
                isOnline = false;
                if (ws) { ws.close();
                    ws = null; }
                playerColor = null;
                isMyTurn = true;
                initBoard();
                updateUI();
            }
        }

        function toggleOnline() {
            if (isOnline && ws) {
                ws.close();
                isOnline = false;
                ws = null;
                playerColor = null;
                isMyTurn = false;
                updateUI();
                return;
            }
            showMenu();
        }

        // ============================================================
        //  网络对战
        // ============================================================
        function startOnlineGame() {
            const btn = document.getElementById('menuOnlineBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 连接中...';

            mode = 'online';
            isOnline = true;
            playerColor = null;
            isMyTurn = false;
            initBoard();

            const wsUrl = wsUrlInput.value.trim() || 'ws://localhost:8765';

            try {
                ws = new WebSocket(wsUrl);
                ws.onopen = function() {
                    console.log('WebSocket 已连接');
                    isOnline = true;
                    btn.disabled = false;
                    btn.textContent = '🌐 网络对战';
                    ws.send(JSON.stringify({ type: 'join', room: 'gomoku' }));
                    hideMenu();
                    updateUI();
                };
                ws.onmessage = function(event) {
                    try {
                        const msg = JSON.parse(event.data);
                        handleNetworkMessage(msg);
                    } catch (e) {
                        console.warn('收到无效消息:', event.data);
                    }
                };
                ws.onerror = function(error) {
                    console.error('WebSocket 错误:', error);
                    isOnline = false;
                    btn.disabled = false;
                    btn.textContent = '🌐 网络对战';
                    updateUI();
                    alert('连接服务器失败，请检查服务器是否启动');
                };
                ws.onclose = function() {
                    console.log('WebSocket 已断开');
                    isOnline = false;
                    btn.disabled = false;
                    btn.textContent = '🌐 网络对战';
                    if (mode === 'online') {
                        updateUI();
                    }
                };
            } catch (e) {
                alert('无法创建 WebSocket 连接: ' + e.message);
                btn.disabled = false;
                btn.textContent = '🌐 网络对战';
                mode = 'local';
                isOnline = false;
            }
        }

        function handleNetworkMessage(msg) {
            console.log('收到网络消息:', msg);
            switch (msg.type) {
                case 'init':
                    playerColor = msg.player;
                    isMyTurn = (playerColor === 'black');
                    if (msg.board) {
                        board = msg.board;
                    }
                    if (msg.current_player) {
                        currentPlayer = msg.current_player;
                    }
                    updateUI();
                    break;

                case 'sync':
                console.log('sync 收到:', msg);
                    if (msg.board) {
                        board = msg.board;
                    }
                    if (msg.current_player) {
                        currentPlayer = msg.current_player;
                        isMyTurn = (currentPlayer === playerColor);
                        console.log('currentPlayer:', currentPlayer, 'playerColor:', playerColor, 'isMyTurn:', isMyTurn);
                    }
                    if (msg.pass_count !== undefined) {
                        passCount = msg.pass_count;
                    }
                    if (msg.game_over) {
                        gameOver = msg.game_over;
                    }
                    if (msg.winner) {
                        winner = msg.winner;
                        gameOver = true;
                        showWinModal(getChinese(winner) + ' 获胜！');
                    }
                    updateUI();
                    break;

                case 'move':
                    const { row, col, player } = msg;
                    if (player !== playerColor) {
                        board[row][col] = player;
                        currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
                        isMyTurn = (currentPlayer === playerColor);
                        updateUI();
                    }
                    break;

                case 'win':
                    gameOver = true;
                    winner = msg.winner;
                    showWinModal(getChinese(winner) + ' 获胜！');
                    updateUI();
                    break;

                case 'pass_notify':
                    passCount = msg.pass_count || 0;
                    currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
                    isMyTurn = (currentPlayer === playerColor);
                    updateUI();
                    break;

                case 'reset':
                    initBoard();
                    updateUI();
                    break;

                case 'error':
                    alert('服务器错误: ' + msg.message);
                    break;

                case 'start':
                    console.log('游戏开始');
                    updateUI();
                    break;

                default:
                    console.log('未知消息类型:', msg.type);
            }
        }

        // ============================================================
        //  退出
        // ============================================================
        function exitGame() {
            if (ws) {
                ws.close();
                ws = null;
            }
            document.body.innerHTML =
                '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#1a1a2e;color:#888;font-size:20px;font-family:Arial;flex-direction:column;gap:16px;"><span>👋 已退出</span><span style="font-size:14px;color:#555;">重新打开页面即可</span></div>';
        }

        // ============================================================
        //  启动
        // ============================================================
        initBoard();
        showMenu();
        updateUI();

        if (!window.WebSocket) {
            console.warn('当前浏览器不支持 WebSocket，网络对战不可用');
        }

        // 暴露到全局
        window.startLocalGame = startLocalGame;
        window.startOnlineGame = startOnlineGame;
        window.exitGame = exitGame;
        window.doPass = doPass;
        window.resetGame = resetGame;
        window.toggleMode = toggleMode;
        window.toggleOnline = toggleOnline;
        window.closeWinModal = closeWinModal;
        window.showMenu = showMenu;
    </script>
</body>
</html>
