<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #2c3e50; font-family: Arial, sans-serif; }
        .container { text-align: center; }
        canvas { background: #deb887; border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5); cursor: pointer; }
        .status { color: white; font-size: 24px; margin-top: 15px; }
        .btn { margin-top: 10px; padding: 10px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; background: #3498db; color: white; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
<div class="container">
    <canvas id="boardCanvas" width="560" height="560"></canvas>
    <div class="status" id="statusMsg">黑棋走</div>
    <button class="btn" onclick="resetGame()">重新开始</button>
</div>
<script>
    // ========== 常量 ==========
    const BOARD_SIZE = 15;
    const CELL_SIZE = 560 / (BOARD_SIZE + 1);
    const MARGIN = CELL_SIZE / 2;
    const canvas = document.getElementById('boardCanvas');
    const ctx = canvas.getContext('2d');
    const statusMsg = document.getElementById('statusMsg');

    // ========== 游戏状态 ==========
    let board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
    let currentPlayer = 'black';
    let gameOver = false;

    // ========== 绘制棋盘 ==========
    function drawBoard() {
        ctx.fillStyle = '#deb887';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        for (let i = 0; i < BOARD_SIZE; i++) {
            const pos = MARGIN + i * CELL_SIZE;
            ctx.beginPath();
            ctx.moveTo(MARGIN, pos);
            ctx.lineTo(canvas.width - MARGIN, pos);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos, MARGIN);
            ctx.lineTo(pos, canvas.height - MARGIN);
            ctx.stroke();
        }
        // 画棋子
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c]) {
                    ctx.beginPath();
                    ctx.arc(MARGIN + c * CELL_SIZE, MARGIN + r * CELL_SIZE, CELL_SIZE/2 - 2, 0, Math.PI * 2);
                    ctx.fillStyle = board[r][c] === 'black' ? '#000' : '#fff';
                    ctx.fill();
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }
    }

    // ========== 检查胜负 ==========
    function checkWin(row, col, player) {
        const directions = [[0,1],[1,0],[1,1],[1,-1]];
        for (let [dr, dc] of directions) {
            let count = 1;
            for (let dir of [1, -1]) {
                for (let step = 1; step < 5; step++) {
                    const r = row + dr * step * dir, c = col + dc * step * dir;
                    if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE || board[r][c] !== player) break;
                    count++;
                }
            }
            if (count >= 5) return true;
        }
        return false;
    }

    // ========== 落子 ==========
    function handleClick(e) {
        if (gameOver) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        const col = Math.round((x - MARGIN) / CELL_SIZE);
        const row = Math.round((y - MARGIN) / CELL_SIZE);
        if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE || board[row][col]) return;
        board[row][col] = currentPlayer;
        if (checkWin(row, col, currentPlayer)) {
            gameOver = true;
            statusMsg.innerText = (currentPlayer === 'black' ? '黑棋' : '白棋') + ' 获胜！';
        } else {
            currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
            statusMsg.innerText = (currentPlayer === 'black' ? '黑棋' : '白棋') + '走';
        }
        drawBoard();
    }

    // ========== 重置 ==========
    function resetGame() {
        board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
        currentPlayer = 'black';
        gameOver = false;
        statusMsg.innerText = '黑棋走';
        drawBoard();
    }

    // ========== 启动 ==========
    canvas.addEventListener('click', handleClick);
    resetGame();
</script>
</body>
</html>
